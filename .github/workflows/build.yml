name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-24.04 ]
        build_type: [ Debug ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- toolchain ----------

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Use GCC 14
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: false
          cache: true
          stripdown: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan>=2.0"

      - name: Conan profile
        run: |
          conan profile detect --force
          conan profile show

      # ---------- dependencies ----------

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('conanfile.py', 'scripts/imguizmo/conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.build_type }}-

      - name: Export local imguizmo recipe
        run: conan export scripts/imguizmo

      - name: Conan install
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            EXTRA="-c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True"
          fi
          conan install . --output-folder=build --build=missing \
            -s build_type=${{ matrix.build_type }} \
            -s compiler.cppstd=23 \
            -c tools.cmake.cmaketoolchain:generator=Ninja \
            $EXTRA

      # ---------- build ----------

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/build/${{ matrix.build_type }}/generators/conan_toolchain.cmake" \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON

      - name: Build
        run: cmake --build build/ci --parallel
